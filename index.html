<!DOCTYPE html><html lang="zh-TW" data-lvt-canonical="1"><!--
Canvas: 手機網頁，單欄，max-width 430px，背景 #F5F1E8，可垂直滾動，底部固定 tab bar
Design given: 現代簡約卡片式修持記錄 App，青綠主色 #0D7377，五頁 tab 導航
Asset map: 無外部圖片，圖表以純 CSS/SVG 實現（環形圖、進度條、柱狀圖、月曆）
Palette:
  --bg #F5F1E8 (given)
  --card #FFFFFF (given)
  --fg #2C2C2C (given)
  --fg-sec #6B6B6B (given)
  --fg-aux #9E9E9E (given)
  --primary #0D7377 (given)
  --primary-light #E6F4F4 (given)
  --success #2E8B8B (given)
  --error #C45B4A (given)
  --progress-bg #E8E8E8 (given)
  --border #E0DDD4 (chosen)
  --tab-bg #FFFFFF (chosen)
  --cal-full #5D3A8C (given v3, 月曆全達標深紫)
  --cal-partial #F4C430 (given v3, 月曆部分達標黃)
Typography: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif (given)
Content map:
  四部經名稱與每日目標 → SUTRAS 常數陣列（v3: 太上老君清靜經）
  超度換算規則 → REDEMPTION 常數陣列
  經典語句庫 → QUOTES 陣列（道德經/大學/論語，依日期輪播）
  底部 tab 標籤 → tab bar 五項
  頁面標題 → 各頁 h1
  按鈕文案 → 各頁按鈕
  狀態標籤 → getStatusLabel()
  成功文案 → 儲存成功畫面
  歷史紀錄 → 總結頁底部，按月聚合所有 localStorage 資料
Assumptions:
  - 問候語已移除（v2）；今日頁頂部為日期大字
  - 月曆全達標深紫 #5D3A8C，部分達標黃 #F4C430（v3）
  - 記錄頁頂部加日期選擇器，可編輯過去任意日期（v3）
  - 月曆明細卡片加「編輯此日」按鈕（v3）
  - 總結頁加超度估算區塊（v3）
  - 今日頁與總結頁底部顯示每日輪播語錄（v3）
  - 語錄依 dayOfYear % quotes.length 輪播
  - 資料遷移：init() 時自動將舊 key「太上老君說常清靜經」轉移至新 key
  - localStorage 使用前做 isStorageAvailable() 安全檢測
Changes v3:
  1. 經名更新 + 舊資料自動遷移
  2. 月曆顏色：全達標深紫、部分達標黃
  3. 記錄頁日期選擇器 + 月曆「編輯此日」按鈕
  4. 總結頁超度估算區塊
  5. 每日輪播經典鼓勵語
  6. 今日頁底部語錄
QA risks:
  - 長經名在小螢幕可能換行 → font-size 14px 輔助
  - 環形 SVG 在舊 Safari 需 stroke-dasharray 正確計算
  - 月曆 7 欄 grid 在 320px 最小寬度需驗證
  - date input 在 iOS Safari 顯示為原生日期選擇器，樣式有限
--><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>修持記錄</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #F5F1E8;
  --card: #FFFFFF;
  --fg: #2C2C2C;
  --fg-sec: #6B6B6B;
  --fg-aux: #9E9E9E;
  --primary: #0D7377;
  --primary-light: #E6F4F4;
  --success: #2E8B8B;
  --error: #C45B4A;
  --progress-bg: #E8E8E8;
  --border: #E0DDD4;
  --tab-bg: #FFFFFF;
  --radius-card: 12px;
  --radius-btn: 10px;
  --pad-card: 16px;
  --gap-section: 24px;
  --tab-h: 86px;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
  background: var(--bg);
  color: var(--fg);
  min-height: 100vh;
  display: flex;
  justify-content: center;
}
#app {
  width: 100%;
  max-width: 430px;
  min-height: 100vh;
  position: relative;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

/* ===== Scrollable Content ===== */
#content-area {
  flex: 1;
  overflow-y: auto;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);
  -webkit-overflow-scrolling: touch;
}

/* ===== Pages ===== */
.page { display: none; padding: 0 16px; padding-top: 16px; }
.page.active { display: block; }

/* ===== Tab Bar ===== */
#tab-bar {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 430px;
  height: calc(var(--tab-h) + env(safe-area-inset-bottom));
  background: var(--tab-bg);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: flex-start;
  padding-top: 4px;
  padding-bottom: env(safe-area-inset-bottom);
  z-index: 100;
  box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
}
.tab-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 44px;
  cursor: pointer;
  padding: 4px 0;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.2s;
  color: var(--fg-aux);
}
.tab-item.active { color: var(--primary); }
.tab-icon { width: 41px; height: 41px; }
.tab-label { font-size: 14px; font-weight: 600; line-height: 1; }

/* ===== Cards ===== */
.card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}

/* ===== Typography ===== */
.page-title { font-size: 28px; font-weight: 700; line-height: 1.2; color: var(--fg); }
.section-title { font-size: 18px; font-weight: 600; line-height: 1.3; color: var(--fg); margin-bottom: 12px; }
.body-text { font-size: 16px; font-weight: 400; line-height: 1.5; }
.aux-text { font-size: 14px; font-weight: 400; line-height: 1.4; color: var(--fg-sec); }
.num-display { font-variant-numeric: tabular-nums; font-weight: 600; }

/* ===== Status Badges ===== */
.badge {
  display: inline-flex;
  align-items: center;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-none { background: #F0F0F0; color: var(--fg-aux); }
.badge-done { background: var(--primary-light); color: var(--success); }
.badge-over { background: #E8F5E9; color: #1B7A3E; }

/* ===== Progress Bar ===== */
.progress-bar-wrap {
  background: var(--progress-bg);
  border-radius: 4px;
  height: 8px;
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
  background: var(--primary);
  transition: width 0.4s ease;
}

/* ===== Buttons ===== */
.btn-primary {
  width: 100%;
  height: 48px;
  background: var(--primary);
  color: #fff;
  border: none;
  border-radius: var(--radius-btn);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s;
}
.btn-primary:active { opacity: 0.85; }
.btn-secondary {
  width: 100%;
  height: 48px;
  background: var(--primary-light);
  color: var(--primary);
  border: none;
  border-radius: var(--radius-btn);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.15s;
}
.btn-secondary:active { opacity: 0.85; }

/* ===== Stepper ===== */
.stepper {
  display: flex;
  align-items: center;
  gap: 0;
  background: var(--bg);
  border-radius: 8px;
  overflow: hidden;
}
.stepper-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: transparent;
  font-size: 20px;
  font-weight: 400;
  color: var(--primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
  flex-shrink: 0;
}
.stepper-input {
  width: 60px;
  height: 44px;
  border: none;
  background: transparent;
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  color: var(--fg);
  font-variant-numeric: tabular-nums;
  -moz-appearance: textfield;
}
.stepper-input.zero-value { color: var(--fg-aux); font-weight: 500; }
.stepper-input::placeholder { color: var(--fg-aux); opacity: 1; }
.stepper-input::-webkit-outer-spin-button,
.stepper-input::-webkit-inner-spin-button { -webkit-appearance: none; }

/* ===== Ring Chart ===== */
.ring-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}
.ring-svg { overflow: visible; }

/* ===== Month Switcher ===== */
.month-switcher {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.month-nav-btn {
  width: 44px;
  height: 44px;
  border: none;
  background: var(--card);
  border-radius: 8px;
  font-size: 18px;
  color: var(--primary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.month-label { font-size: 18px; font-weight: 600; color: var(--fg); }

/* ===== Calendar ===== */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}
.cal-header-cell {
  text-align: center;
  font-size: 12px;
  font-weight: 600;
  color: var(--fg-aux);
  padding: 6px 0;
}
.cal-cell {
  display: -webkit-box;
  display: -ms-flexbox;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -ms-flex-direction: column;
  flex-direction: column;
  -webkit-box-align: center;
  -ms-flex-align: center;
  align-items: center;
  -webkit-box-pack: center;
  -ms-flex-pack: center;
  justify-content: center;
  gap: 2px;
  border-radius: 8px;
  cursor: pointer;
  min-height: 44px;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  /* aspect-ratio fallback for older browsers */
  width: calc((100% - 12px) / 7);
  aspect-ratio: 1;
}
.cal-cell:active { background: var(--primary-light); }
.cal-cell.today .cal-date-num {
  background: var(--primary);
  color: #fff;
  border-radius: 50%;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cal-cell.selected { background: var(--primary-light); }
.cal-date-num { font-size: 14px; font-weight: 500; color: var(--fg); line-height: 1; }
.cal-cell.other-month .cal-date-num { color: var(--fg-aux); }
/* cal-dot styles moved to v3 section above */

/* ===== Detail Card ===== */
.detail-card {
  background: var(--primary-light);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-top: 12px;
}

/* ===== Bar Chart ===== */
.bar-chart {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 80px;
  padding: 0 4px;
}
.bar-col {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  height: 100%;
  justify-content: flex-end;
}
.bar-fill {
  width: 100%;
  border-radius: 3px 3px 0 0;
  background: var(--primary);
  min-height: 2px;
  transition: height 0.3s ease;
}
.bar-fill.goal-met { background: var(--success); }
.bar-label { font-size: 9px; color: var(--fg-aux); }

/* ===== Stats Grid ===== */
.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
.stat-card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.stat-num { font-size: 32px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums; line-height: 1; }
.stat-label { font-size: 13px; color: var(--fg-sec); }

/* ===== Empty State ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 48px 24px;
  text-align: center;
}
.empty-icon { font-size: 48px; }

/* ===== Success State ===== */
.success-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  padding: 32px 0;
  text-align: center;
}
.success-icon {
  width: 72px;
  height: 72px;
  background: var(--primary-light);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ===== Sutra Row ===== */
.sutra-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.sutra-row:last-child { border-bottom: none; }
.sutra-name { font-size: 15px; font-weight: 500; color: var(--fg); flex: 1; min-width: 0; padding-right: 8px; }
.sutra-count { font-size: 14px; color: var(--fg-sec); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ===== Progress List Item ===== */
.progress-item {
  padding: 14px 0;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
}
.progress-item:last-child { border-bottom: none; }
.progress-item-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.progress-item-name { font-size: 15px; font-weight: 600; color: var(--fg); }
.progress-item-pct { font-size: 14px; font-weight: 600; color: var(--primary); font-variant-numeric: tabular-nums; }
.progress-item-sub {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.progress-detail {
  display: none;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.progress-detail.open { display: block; }

/* ===== Date Header (greeting removed v2) ===== */
.date-header {
  margin-bottom: 20px;
}
.date-header-main { font-size: 22px; font-weight: 700; color: var(--fg); line-height: 1.3; }
.date-header-sub { font-size: 14px; color: var(--fg-sec); margin-top: 2px; }

/* ===== Calendar dot colors v3 ===== */
.cal-dot { width: 6px; height: 6px; border-radius: 50%; background: #5D3A8C; }
.cal-dot.partial { background: #F4C430; }

/* ===== Quote Block ===== */
.quote-block {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: 16px;
  margin-bottom: 12px;
  border-left: 4px solid var(--primary);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.quote-text {
  font-size: 15px;
  font-weight: 500;
  color: var(--fg);
  line-height: 1.7;
  font-style: italic;
}
.quote-source {
  font-size: 12px;
  color: var(--fg-aux);
  margin-top: 6px;
  text-align: right;
}

/* ===== Date Picker ===== */
.date-picker-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  background: var(--card);
  border-radius: var(--radius-card);
  padding: 12px 16px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.date-picker-label { font-size: 14px; color: var(--fg-sec); white-space: nowrap; }
#record-date-picker {
  flex: 1;
  height: 40px;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0 10px;
  font-size: 15px;
  color: var(--fg);
  background: var(--bg);
  font-family: inherit;
  -webkit-appearance: none;
}

/* ===== Redemption Section (v5 table) ===== */
.redemption-section { margin-top: 8px; margin-bottom: 8px; }
.redemption-card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  overflow: hidden;
}
.redemption-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 12px;
  line-height: 1.3;
}
.redemption-sub-text {
  text-align: center;
  font-size: 12px;
  color: var(--fg-aux);
  margin-bottom: 10px;
}
/* Table */
.redemption-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.redemption-table th {
  background: #0D7377;
  color: #fff;
  font-weight: 600;
  padding: 9px 8px;
  text-align: center;
  font-size: 13px;
  letter-spacing: 0.02em;
}
.redemption-table th:first-child { text-align: left; padding-left: 12px; }
.redemption-table td {
  padding: 10px 8px;
  border-bottom: 1px solid var(--border);
  color: var(--fg);
  text-align: center;
  vertical-align: middle;
}
.redemption-table td:first-child {
  text-align: left;
  padding-left: 12px;
  font-size: 13px;
  color: var(--fg);
  line-height: 1.4;
}
.redemption-table td.num-cell {
  font-size: 18px;
  font-weight: 700;
  color: #5D3A8C;
  font-variant-numeric: tabular-nums;
}
.redemption-table tr:last-child td { border-bottom: none; }
/* Total row */
.redemption-table tr.total-row td {
  background: #F3EEF9;
  font-weight: 700;
  border-top: 2px solid #5D3A8C;
  border-bottom: none;
}
.redemption-table tr.total-row td:first-child {
  color: #5D3A8C;
  font-size: 14px;
}
.redemption-table tr.total-row td.num-cell {
  font-size: 20px;
  color: #5D3A8C;
}
.redemption-history-text {
  text-align: center;
  font-size: 12px;
  color: var(--fg-aux);
  border-top: 1px solid var(--border);
  padding-top: 10px;
  margin-top: 10px;
}

/* ===== Encourage (kept for structure, content replaced by quote) ===== */
.encourage-text {
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  color: var(--primary);
  padding: 20px 0 8px;
  letter-spacing: 0.05em;
}

/* ===== Input Card ===== */
.input-card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-bottom: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.input-card-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 12px;
  gap: 8px;
}
.input-card-name { font-size: 16px; font-weight: 600; color: var(--fg); flex: 1; }
.input-card-goal { font-size: 13px; color: var(--fg-sec); white-space: nowrap; }
.input-card-body {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

/* ===== Divider ===== */
.divider { height: 1px; background: var(--border); margin: 8px 0; }

/* ===== Fade transition ===== */
.page { animation: none; }
.page.active { animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ===== Toast ===== */
#toast {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: var(--fg);
  color: #fff;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 500;
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 200;
  pointer-events: none;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ===== Scrollbar hide ===== */
#content-area::-webkit-scrollbar { display: none; }
#content-area { scrollbar-width: none; }

/* ===== History Section ===== */
.history-section { margin-top: 8px; margin-bottom: 8px; }
.history-section-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--fg);
  margin-bottom: 12px;
  line-height: 1.3;
}
.history-month-card {
  background: var(--card);
  border-radius: var(--radius-card);
  padding: var(--pad-card);
  margin-bottom: 10px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.history-month-title {
  font-size: 15px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;

function getDailyQuote() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  const dayOfYear = Math.floor(diff / oneDay);
  return QUOTES[dayOfYear % QUOTES.length];
}
function renderQuoteBlock(elId) {
  const el = document.getElementById(elId);
  if (!el) return;
  const q = getDailyQuote();

  try {
    var test = '__storage_test__';
    localStorage.setItem(test, test);
    localStorage.removeItem(test);
    return true;
  } catch(e) { return false; }
}
var _storageOk = isStorageAvailable();

// ===== Data Layer =====
function loadData() {
  if (!_storageOk) return {};
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e) { return {}; }
}
function saveData(data) {
  if (!_storageOk) { showToast('此瀏覽器不支援本地儲存'); return; }
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { showToast('儲存失敗，請檢查瀏覽器設定'); }
}
function getTodayKey() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function getDateKey(y, m, d) {
  return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}
function getDaysInMonth(y, m) {
  return new Date(y, m, 0).getDate();
}
function getMonthGoal(y, m) {
  const days = getDaysInMonth(y, m);
  return SUTRAS.reduce((s, su) => s + su.goal * days, 0);
}
function getMonthActual(data, y, m) {
  let total = 0;
  const days = getDaysInMonth(y, m);
  for (let d = 1; d <= days; d++) {
    const key = getDateKey(y, m, d);
    if (data[key]) {
      SUTRAS.forEach(su => { total += (data[key][su.name] || 0); });
    }
  }
  return total;
}
function getMonthSutraTotal(data, y, m, sutraName) {
  let total = 0;
  const days = getDaysInMonth(y, m);
  for (let d = 1; d <= days; d++) {
    const key = getDateKey(y, m, d);
    if (data[key]) total += (data[key][sutraName] || 0);
  }
  return total;
}
function getDayStatus(data, dateKey) {
  // returns: 'full' | 'partial' | 'none'
  const rec = data[dateKey];
  if (!rec) return 'none';
  const hasAny = SUTRAS.some(su => (rec[su.name] || 0) > 0);
  if (!hasAny) return 'none';
  const allMet = SUTRAS.every(su => (rec[su.name] || 0) >= su.goal);
  return allMet ? 'full' : 'partial';
}
function getStatusLabel(count, goal) {
  if (count < goal) return { label: '未達標', cls: 'badge-none' };
  if (count === goal) return { label: '已達標', cls: 'badge-done' };
  return { label: '超額完成', cls: 'badge-over' };
}
function getStreak(data) {
  const today = new Date();
  let streak = 0;
  for (let i = 0; i < 365; i++) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = getDateKey(d.getFullYear(), d.getMonth()+1, d.getDate());
    const rec = data[key];
    if (rec && SUTRAS.some(su => (rec[su.name] || 0) > 0)) {
      streak++;
    } else if (i === 0) {
      continue; // 今天還沒記錄，不中斷，從昨天起算
    } else {
      break;
    }
  }
  return streak;
}
function getGoalDays(data, y, m) {
  let count = 0;
  const days = getDaysInMonth(y, m);
  for (let d = 1; d <= days; d++) {
    const key = getDateKey(y, m, d);
    const rec = data[key];
    if (rec && SUTRAS.every(su => (rec[su.name] || 0) >= su.goal)) count++;
  }
  return count;
}
function getBestSutra(data, y, m) {
  let best = null, bestCount = -1;
  SUTRAS.forEach(su => {
    const total = getMonthSutraTotal(data, y, m, su.name);
    if (total > bestCount) { bestCount = total; best = su.name; }
  });
  return bestCount > 0 ? best : '—';
}

// ===== Date Formatting =====
function formatDate(d) {
  var days = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日 ' + days[d.getDay()];
}
function formatDateShort(d) {
  var days = ['日','一','二','三','四','五','六'];
  return (d.getMonth()+1) + '月' + d.getDate() + '日（' + days[d.getDay()] + '）';
}

// ===== Ring Chart =====
function setRing(fillEl, pctEl, pct, circumference) {
  const offset = circumference * (1 - Math.min(pct, 1));
  fillEl.setAttribute('stroke-dashoffset', offset.toFixed(2));
  pctEl.textContent = Math.round(pct * 100) + '%';
}

// ===== Tab Switching =====
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  const tabBtn = document.querySelector(`[data-tab="${tab}"]`);
  if (tabBtn) tabBtn.classList.add('active');
  document.getElementById('content-area').scrollTop = 0;
  renderPage(tab);
}

// ===== Render Dispatch =====
function renderPage(tab) {
  if (tab === 'home') renderHome();
  else if (tab === 'record') renderRecord();
  else if (tab === 'progress') renderProgress();
  else if (tab === 'calendar') renderCalendar();
  else if (tab === 'summary') renderSummary();
  else if (tab === 'backup') refreshBackupInfo();
  else if (tab === 'expense') return;
}

function numberInputVisual(input) {
  input.classList.toggle('zero-value', input.value === '' || Number(input.value) === 0);
}
function numberInputFocus(input) {
  if (Number(input.value) === 0) {
    input.classList.add('zero-value');
    setTimeout(() => { try { input.select(); } catch(e) {} }, 0);
  }
}
function numberInputBlur(name, input) {
  if (input.value === '') input.value = '0';
  numberInputVisual(input);
  inputChange(name, input.value);
}

function stepChange(name, delta) {
  const cur = recordInputValues[name] || 0;
  const newVal = Math.max(0, cur + delta);
  recordInputValues[name] = newVal;
  const input = document.getElementById('input-' + name);
  if (input) { input.value = newVal; numberInputVisual(input); }
  updateBadge(name, newVal);
}
function inputChange(name, val) {
  const v = Math.max(0, parseInt(val) || 0);
  recordInputValues[name] = v;
  const input = document.getElementById('input-' + name);
  if (input) numberInputVisual(input);
  updateBadge(name, v);
}
function updateBadge(name, val) {
  const su = SUTRAS.find(s => s.name === name);
  if (!su) return;
  const st = getStatusLabel(val, su.goal);
  const badge = document.getElementById('badge-' + name);
  if (badge) {
    badge.className = 'badge ' + st.cls;
    badge.textContent = st.label;
  }
}

function getGoalDaysForSutra(data, y, m, su) {
  let count = 0;
  const days = getDaysInMonth(y, m);
  for (let d = 1; d <= days; d++) {
    const key = getDateKey(y, m, d);
    const rec = data[key];
    if (rec && (rec[su.name] || 0) >= su.goal) count++;
  }
  return count;
}

function buildBarChart(idx, data, y, m, su, days) {
  const container = document.getElementById('bar-chart-' + idx);
  if (!container) return;
  container.innerHTML = '';
  let maxVal = 0;
  const vals = [];
  for (let d = 1; d <= days; d++) {
    const key = getDateKey(y, m, d);
    const v = (data[key] && data[key][su.name]) || 0;
    vals.push(v);
    if (v > maxVal) maxVal = v;
  }
  if (maxVal === 0) maxVal = su.goal;
  vals.forEach((v, i) => {
    const col = document.createElement('div');
    col.className = 'bar-col';
    const heightPct = Math.round((v / maxVal) * 100);
    const metGoal = v >= su.goal;
    col.innerHTML = `<div class="bar-fill${metGoal ? ' goal-met' : ''}" style="height:${heightPct}%"></div>
      <div class="bar-label">${i+1}</div>`;
    container.appendChild(col);
  });
}

function toggleProgressDetail(idx) {
  const detail = document.getElementById('progress-detail-' + idx);
  const chevron = document.getElementById('progress-chevron-' + idx);
  if (!detail) return;
  const isOpen = detail.classList.contains('open');
  // Close all
  document.querySelectorAll('.progress-detail').forEach(d => d.classList.remove('open'));
  document.querySelectorAll('[id^="progress-chevron-"]').forEach(c => c.style.transform = '');
  if (!isOpen) {
    detail.classList.add('open');
    if (chevron) chevron.style.transform = 'rotate(180deg)';
  }
}

function buildCalendar() {
  const data = loadData();
  const y = calViewYear, m = calViewMonth;
  document.getElementById('cal-month-label').textContent = `${y}年${m}月`;

  // Header
  const header = document.getElementById('cal-header');

    cell.textContent = d;
    header.appendChild(cell);
  });

  // Body
  const body = document.getElementById('cal-body');
  body.innerHTML = '';
  const firstDay = new Date(y, m - 1, 1).getDay();
  const days = getDaysInMonth(y, m);
  const today = new Date();
  const todayStr = getTodayKey();

  // Prev month filler
  const prevDays = getDaysInMonth(y, m === 1 ? 12 : m - 1, m === 1 ? y - 1 : y);
  for (let i = 0; i < firstDay; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<span class="cal-date-num">${prevDays - firstDay + 1 + i}</span>`;
    body.appendChild(cell);

  for (let d = 1; d <= days; d++) {

    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (isToday ? ' today' : '');
    cell.onclick = () => showCalDetail(dateKey, d);

    let dotHtml = '';

    else if (status === 'partial') dotHtml = '<div class="cal-dot partial"></div>';

    cell.innerHTML = `<span class="cal-date-num">${d}</span>${dotHtml}`;
    body.appendChild(cell);
  }

  // Next month filler
  const total = firstDay + days;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i = 1; i <= remaining; i++) {
    const cell = document.createElement('div');
    cell.className = 'cal-cell other-month';
    cell.innerHTML = `<span class="cal-date-num">${i}</span>`;
    body.appendChild(cell);
  }

function getAllTimeSutraTotal(data, sutraName) {
  var total = 0;
  var keys = Object.keys(data);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    if (/^\d{4}-\d{2}-\d{2}$/.test(k) && data[k]) {
      total += (data[k][sutraName] || 0);
    }
  }
  return total;
}

// ===== HISTORY SECTION =====
function buildHistory(data) {
  var container = document.getElementById('history-list');
  if (!container) return;
  container.innerHTML = '';

  // Collect all YYYY-MM keys from data
  var monthSet = {};
  var keys = Object.keys(data);
  for (var i = 0; i < keys.length; i++) {
    var k = keys[i];
    // Validate format YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(k)) {
      var ym = k.substring(0, 7); // YYYY-MM
      monthSet[ym] = true;
    }
  }

  var months = Object.keys(monthSet).sort().reverse(); // descending

  if (months.length === 0) {
    container.innerHTML = '<div class="history-empty">尚無歷史記錄</div>';
    return;
  }

  for (var j = 0; j < months.length; j++) {
    var ym = months[j];
    var parts = ym.split('-');
    var hy = parseInt(parts[0], 10);
    var hm = parseInt(parts[1], 10);

    var card = document.createElement('div');
    card.className = 'history-month-card';

    var titleDiv = document.createElement('div');
    titleDiv.className = 'history-month-title';
    titleDiv.textContent = hy + '年 ' + String(hm).padStart(2, '0') + '月';
    card.appendChild(titleDiv);

    for (var s = 0; s < SUTRAS.length; s++) {
      var su = SUTRAS[s];
      var total = getMonthSutraTotal(data, hy, hm, su.name);
      var row = document.createElement('div');
      row.className = 'history-sutra-row';
      row.innerHTML = '<span class="history-sutra-name">' + su.name + '</span>' +
        '<span class="history-sutra-count">' + total + ' 遍</span>';
      card.appendChild(row);
    }

    container.appendChild(card);
  }
}

// ===== Toast =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ===== Data Migration =====
function migrateOldSutraName() {
  if (!_storageOk) return;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    var data = JSON.parse(raw);
    var changed = false;
    var keys = Object.keys(data);
    for (var i = 0; i < keys.length; i++) {
      var k = keys[i];
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && data[k]) {
        if (data[k][OLD_SUTRA_NAME] !== undefined) {
          // Merge: add old value to new key (in case new key already has data)
          data[k][NEW_SUTRA_NAME] = (data[k][NEW_SUTRA_NAME] || 0) + data[k][OLD_SUTRA_NAME];
          delete data[k][OLD_SUTRA_NAME];
          changed = true;
        }
      }
    }
    if (changed) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  } catch(e) {}
}


// ===== Backup / Restore =====
var EXPENSE_KEYS = ['hongjun.records.creditor','hongjun.records.inquiry','hongjun.records.treasury','hongjun.records.grievance'];
var LAST_BACKUP_KEY = 'sutraLastBackup';

function refreshBackupInfo() {
  var st = document.getElementById('backup-stats');
  if (st) {
    var days = Object.keys(loadData()).filter(function(k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).length;
    function cnt(k) { try { var a = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(a) ? a.length : 0; } catch(e) { return 0; } }
    st.textContent = '目前資料：修持 ' + days + ' 天｜債主 ' + cnt(EXPENSE_KEYS[0]) + '、問事 ' + cnt(EXPENSE_KEYS[1]) +
      '、補財庫 ' + cnt(EXPENSE_KEYS[2]) + '、冤親 ' + cnt(EXPENSE_KEYS[3]) + ' 筆';
  }
  var el = document.getElementById('backup-last');
  if (!el) return;
  var t = null;
  try { t = localStorage.getItem(LAST_BACKUP_KEY); } catch(e) {}
  if (!t) { el.textContent = '尚未備份過，建議定期匯出。'; return; }
  var d = new Date(t);
  var days = Math.floor((Date.now() - d.getTime()) / 86400000);
  el.textContent = '上次備份：' + d.getFullYear() + '/' + (d.getMonth()+1) + '/' + d.getDate() +
    (days >= 30 ? '（已超過 ' + days + ' 天，建議重新備份）' : '');
}

async function exportBackup() {
  if (!_storageOk) { showToast('此瀏覽器不支援本地儲存'); return; }
  var payload = { app: 'sutra-tracker', version: 1, exportedAt: new Date().toISOString(),
                  sutraTrackerData: loadData(), expense: {} };
  EXPENSE_KEYS.forEach(function(k) {
    try { var v = localStorage.getItem(k); if (v !== null) payload.expense[k] = v; } catch(e) {}
  });
  var name = '修持記錄備份_' + getTodayKey().replace(/-/g, '') + '.json';
  var text = JSON.stringify(payload);
  try {
    var file = new File([text], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: name });
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function() { URL.revokeObjectURL(a.href); }, 5000);
    }
    localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString());
    refreshBackupInfo();
    showToast('備份已匯出 ✓');
  } catch(e) {
    if (e && e.name === 'AbortError') return; // 使用者取消分享
    showToast('匯出失敗');
  }
}

function importBackup(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  var reader = new FileReader();
  reader.onload = function() {
    var p;
    try { p = JSON.parse(reader.result); } catch(e) { showToast('檔案格式錯誤'); return; }
    if (!p || p.app !== 'sutra-tracker' || typeof p.sutraTrackerData !== 'object' || p.sutraTrackerData === null) {
      showToast('這不是有效的備份檔'); return;
    }
    var incoming = p.sutraTrackerData;
    var n = Object.keys(incoming).filter(function(k) { return /^\d{4}-\d{2}-\d{2}$/.test(k); }).length;
    if (!confirm('將匯入 ' + n + ' 天的修持記錄。\n同日期會以備份檔為準，其餘日期保留。\n\n確定匯入？')) return;
    var data = loadData();
    Object.keys(incoming).forEach(function(k) {
      if (/^\d{4}-\d{2}-\d{2}$/.test(k) && incoming[k] && typeof incoming[k] === 'object') data[k] = incoming[k];
    });
    saveData(data);
    var exp = p.expense && typeof p.expense === 'object' ? p.expense : {};
    var hasExp = EXPENSE_KEYS.some(function(k) { return typeof exp[k] === 'string'; });
    if (hasExp && confirm('備份檔也包含問事管理資料。\n要還原嗎？（會取代目前的問事管理資料）')) {
      EXPENSE_KEYS.forEach(function(k) {
        if (typeof exp[k] === 'string') { try { localStorage.setItem(k, exp[k]); } catch(e) {} }
      });
    }
    showToast('匯入完成 ✓');
    setTimeout(function() { location.reload(); }, 600);
  };
  reader.readAsText(f);
}

function expenseDoc() {
  var f = document.getElementById('expense-frame');
  return f && f.contentDocument;
}
function expenseExcelExport() {
  var d = expenseDoc(), b = d && d.getElementById('btn-export');
  if (!b) { showToast('問事管理尚未載入，請稍後再試'); return; }
  b.click();
}
function expenseExcelImport(input) {
  var f = input.files && input.files[0];
  input.value = '';
  if (!f) return;
  var d = expenseDoc(), target = d && d.getElementById('file-import');
  if (!target) { showToast('問事管理尚未載入，請稍後再試'); return; }
  try {
    var dt = new DataTransfer();
    dt.items.add(f);
    target.files = dt.files;
    switchTab('expense'); // 匯入選項視窗在問事管理頁顯示
    target.dispatchEvent(new Event('change', { bubbles: true }));
  } catch(e) { showToast('此瀏覽器不支援，請改用完整備份（JSON）'); }
}

// ===== Init =====
function init() {
  const now = new Date();
  calViewYear = now.getFullYear();
  calViewMonth = now.getMonth() + 1;
  sumViewYear = now.getFullYear();
  sumViewMonth = now.getMonth() + 1;
  recordSelectedDate = getTodayKey();

  // Ask browser to keep storage (reduces risk of eviction)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e) {}

  // Migrate old sutra name data
  migrateOldSutraName();

  // Init record inputs from today's data
  const data = loadData();
  const todayKey = getTodayKey();
  const rec = data[todayKey] || {};
  SUTRAS.forEach(su => {
    recordInputValues[su.name] = rec[su.name] || 0;
  });

  // Set date picker default
  const picker = document.getElementById('record-date-picker');
  if (picker) picker.value = todayKey;

  renderHome();
}

init();
</script>
